[package]
name = "airkan-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "小米妙享/互联遥控协议 设备端 (airkan) — 让设备被小米手机遥控"

[lib]
name = "airkan"
path = "src/lib.rs"
crate-type = ["rlib"]

# 纯 std 实现，零第三方依赖，便于自测与移植

[[test]]
name = "proto"
path = "tests/proto_test.rs"

[[test]]
name = "integration"
path = "tests/integration_test.rs"